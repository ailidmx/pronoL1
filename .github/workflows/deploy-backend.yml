name: Deploy Backend
on:
  push:
    branches: [main]
    paths: ['functions/**', 'packages/domain/**', 'scripts/seed-sports-registry.mjs', 'scripts/seed-bonus-config.mjs', 'scripts/migrate-ligue1-2026-scope.mjs', 'firestore.rules', 'firebase.json']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
      - run: npm ci && npm run build -w @prono-l1/functions
      - run: node scripts/seed-sports-registry.mjs && node scripts/migrate-ligue1-2026-scope.mjs && node scripts/seed-bonus-config.mjs --execute
      - run: npm install -g firebase-tools
      - run: firebase deploy --project pronol1 --only firestore,functions --non-interactive --force
