name: Deploy Player
on:
  push:
    branches: [main]
    paths: ['apps/player-web/**', 'packages/design-tokens/**', 'packages/ui-primitives/**', 'firebase.json', '.firebaserc']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
      - run: npm ci && npm run build:player
      - run: npm install -g firebase-tools
      - run: firebase deploy --project pronol1 --only hosting:player --non-interactive
