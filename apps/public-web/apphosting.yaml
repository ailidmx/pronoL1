# Firebase App Hosting configuration for the independent public application.
# Public analytics ingestion identifiers are safe to expose in application configuration.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# The Firebase adapter otherwise infers `next start`, which exits before
# listening in the managed container. The standalone server is the artifact
# produced and verified by the build.
scripts:
  runCommand: node .next/standalone/server.js

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://pronol1-public--pronol1.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_NAME
    value: Stat de Foot
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
    value: G-3QE39K3F79
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PRIVATE_APP_URL
    value: https://pronol1.web.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    value: BO3rO2tkbCVPTgCa-wRgEMBDbLnTpC9lupFIW594liQae2NUxfyxT9P_zjrKG_C_8FTQSRYMdhKITKVFoETPu9Q
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_THEME_EXPERIMENT_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_EXPERIMENT_SALT
    value: prono-l1-public-theme-v1
    availability:
      - BUILD
      - RUNTIME
  - variable: POSTHOG_PROJECT_API_KEY
    value: phc_wzqaxHDLZdKpXjnXLGJtiySWu5aWWjy3PSPrbiZQJKTM
    availability:
      - RUNTIME
  - variable: POSTHOG_HOST
    value: https://eu.i.posthog.com
    availability:
      - RUNTIME
